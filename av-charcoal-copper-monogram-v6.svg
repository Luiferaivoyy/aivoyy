<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 84" role="img" aria-labelledby="title desc">
  <title id="title">AI Voyy charcoal and copper logo</title>
  <desc id="desc">A bright one-piece AV monogram with a silver-charcoal A flowing into a black-to-copper V, followed by the AI Voyy wordmark.</desc>
  <defs>
    <linearGradient id="aMetal" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f8f8f8"/>
      <stop offset="0.18" stop-color="#c9c9c9"/>
      <stop offset="0.42" stop-color="#737373"/>
      <stop offset="0.68" stop-color="#2f2f2f"/>
      <stop offset="1" stop-color="#161616"/>
    </linearGradient>
    <linearGradient id="vMetal" x1="0" y1="0" x2="1" y2="0.9">
      <stop offset="0" stop-color="#191919"/>
      <stop offset="0.28" stop-color="#303030"/>
      <stop offset="0.52" stop-color="#7d4932"/>
      <stop offset="0.76" stop-color="#e49a68"/>
      <stop offset="1" stop-color="#ffd1ad"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e0e0e0"/>
      <stop offset="1" stop-color="#a6a6a6"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-35%" width="160%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.8" flood-color="#000" flood-opacity=".58"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Broad, bright A from the supplied charcoal/copper reference. -->
    <path fill="url(#aMetal)" d="M5 67 37 11c3.3-5.8 11.6-5.8 14.9 0L82 67H64.8L57 52.4H29.8L21.4 67H5Zm32.6-29.7h11.8L43.6 26.2 37.6 37.3Z"/>
    <!-- V overlaps the A so the two letters read as one continuous symbol. -->
    <path fill="url(#vMetal)" d="M51.2 15.1h17.5l14.7 31.7 19.3-34.3h18.2L90.1 68.1c-3 5.4-10.7 5.5-13.8.1L51.2 15.1Z"/>
    <path d="M8.5 64.5 39.4 11.8" stroke="#fff" stroke-opacity=".35" stroke-width="1.3"/>
    <path d="M104 14.3 84.7 47.2" stroke="#fff4e9" stroke-opacity=".48" stroke-width="1.5"/>
  </g>
  <text x="138" y="55" fill="url(#word)" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="1">AI Voyy</text>
</svg>
